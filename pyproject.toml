# ARIA packaging — PEP 621 (P2-1).
#
# Version is dynamic and derives from the SINGLE source of truth
# `aria/version.py:__version__` (P0-9). Runtime science envs are managed by
# conda (see envs/); this pip metadata covers the orchestrator/core package and
# an optional `analysis` extra. Reproducible installs are pinned by the
# lockfiles in envs/ (conda) and requirements.lock (pip core) — see
# docs/architecture and scripts/generate_locks.sh.
#
# Version ceilings: each dependency caps the next major it has NOT been
# validated against, so an unvetted major release cannot silently change a run.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-omics"
description = "Agentic Research Intelligence for -omics Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["version"]

dependencies = [
    "anthropic>=0.25.0,<1.0",
    "litellm>=1.30.0,<2.0",
    "rich>=13.7.0,<16.0",
    "tiktoken>=0.6.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31.0,<3.0",
    "tqdm>=4.66.0,<5.0",
    "click>=8.1.0,<9.0",
    "pydantic>=2.0.0,<3.0",
    "numpy>=1.24.0,<3.0",
    "pandas>=2.0.0,<3.0",
    "h5py>=3.9.0,<4.0",
    "anndata>=0.10.0,<1.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
analysis = [
    "scanpy[leiden]>=1.9.6,<2.0",
    "squidpy>=1.3.0,<2.0",
    "scipy>=1.11.0,<2.0",
    "scikit-learn>=1.3.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "seaborn>=0.12.0,<1.0",
]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-cov>=4.1.0,<7.0",
    "black>=23.0.0,<26.0",
    "ruff>=0.1.0,<1.0",
]

[project.scripts]
aria = "aria.tui:main"
aria-doctor = "aria.doctor:console_main"

[tool.setuptools.dynamic]
version = { attr = "aria.version.__version__" }

[tool.setuptools.packages.find]
include = ["aria*"]
