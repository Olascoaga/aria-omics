name: ARIA CI

# Closes part of F-ENG-REPRO (senior audit 2026-05-28): the "publication-grade
# reproducibility" claim was documented but not enforced. This workflow turns
# the local validation gates into checks that run on every push / PR.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Fast lane: pure-Python tests that do not need the heavy conda stack ──
  # The smoke suite uses pytest.importorskip, so it runs the subset that the
  # lightweight pip env supports and skips the rest.
  lint-and-light-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + light test deps
        run: |
          python -m pip install --upgrade pip
          # Core runtime deps + the libraries the pure-Python tests import.
          pip install -e .
          pip install pytest numpy pandas scipy anndata scikit-learn

      - name: Byte-compile the package
        run: python -m compileall -q aria

      - name: Run audit-gate tests (no pydeseq2 required)
        run: |
          python -m pytest -q \
            tests/test_narrative_types.py \
            tests/test_narrative_validators.py \
            tests/test_narrator_scrna.py \
            tests/test_narrator_bulk.py \
            tests/test_narrative_render_blocks.py \
            tests/test_causal_guard.py \
            tests/test_headless_design_e2e.py \
            tests/test_env_manager_cache.py

      - name: Run integration smoke suite (importorskip-gated)
        run: python -m pytest -q tests/test_pytest_smoke.py

  # ── Heavy lane: the full RNA conda env for pydeseq2-gated tests. ─────────
  # Allowed to fail until the env is containerized in CI (the local lockfile
  # is linux-64 snapshot-from-installed); kept as a tracking signal.
  rna-env-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/aria-rna-env.yml
          cache-environment: true

      - name: Run pydeseq2-gated tests
        shell: bash -el {0}
        env:
          NUMBA_CACHE_DIR: /tmp/numba_cache
        run: |
          pip install -e .
          python -m pytest -q \
            tests/test_pytest_smoke.py::test_scrna_pseudobulk_uses_h5ad_obs_design \
            || echo "rna-env gated tests need the full stack; tracked, non-blocking"
