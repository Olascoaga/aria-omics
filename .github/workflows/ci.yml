name: ARIA CI

# P1-10 (master audit pre-4.6): a blocking, 3-tier gate + supply-chain hygiene.
#   PR      -> lint + unit + contracts + guards (pure-Python, importorskip-gated)
#             + packaging metadata (P2-1)
#   main    -> the above + the heavy pydeseq2 conda lane + recent closeout tests
#   release -> base + RNA Docker build + conda env solve + a real mini DE
#             benchmark + a CycloneDX SBOM of the image (P2-2)
#   always  -> gitleaks secret scan (P2-2)
# No lane is `continue-on-error`: a red lane is a real failure signal. Closes
# F-ENG-REPRO / the master plan's "CI no bloqueante" finding.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Tier 1 (PR + main): lint + unit + contracts + guards ─────────────────
  # Pure-Python lane. Tests that need scanpy/pydeseq2 self-skip via
  # pytest.importorskip, so this lane runs the subset the pip env supports.
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + light test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy pandas scipy anndata scikit-learn

      - name: Byte-compile the package
        run: python -m compileall -q aria

      - name: Packaging metadata (P2-1, reproducible install)
        # `pip install -e .` above already built from pyproject; assert the
        # installed metadata matches the single-source version + 3.11 floor and
        # run the pure packaging guard (version-drift regression).
        run: |
          python -c "import importlib.metadata as m, aria; \
            md = m.metadata('aria-omics'); \
            assert md['Requires-Python'] == '>=3.11', md['Requires-Python']; \
            assert m.version('aria-omics') == aria.__version__, m.version('aria-omics')"
          python -m pytest -q tests/test_packaging.py

      - name: Governance guards (anti-fabrication + IPC contract coverage)
        # Two test_script_contracts cases drive a real `conda run` subprocess and
        # need the full RNA env (covered by the heavy lane / Docker); deselect
        # them here so the pure-Python contract checks still gate the PR.
        run: |
          python -m pytest -q \
            tests/test_no_fabrication_guard.py \
            tests/test_dispatchable_contracts.py \
            tests/test_registry_integrity.py \
            tests/test_script_contracts.py \
            tests/test_cellcomm_contract.py \
            --deselect tests/test_script_contracts.py::test_environment_manager_validates_script_output_contract \
            --deselect tests/test_script_contracts.py::test_environment_manager_attaches_contract_metadata_on_success

      - name: Sprint-0 / Sprint-1 correctness gates
        run: |
          python -m pytest -q \
            tests/test_llm_partial_config.py \
            tests/test_hic_dispatch_gate.py \
            tests/test_filename_fallback_gate.py \
            tests/test_wnn_no_fabrication.py \
            tests/test_analysis_thresholds.py \
            tests/test_explicit_contrast_gate.py \
            tests/test_pseudobulk_gate.py \
            tests/test_bulk_covariates.py \
            tests/test_geo_design.py \
            tests/test_geo_spikein_inference.py \
            tests/test_local_ora.py \
            tests/test_egress_governance.py \
            tests/test_sensitivity_privacy.py \
            tests/test_parameter_advisor_honesty.py \
            tests/test_secret_hygiene.py \
            tests/test_doctor_diagnostics.py \
            tests/test_packaging.py \
            tests/test_docker_hermeticity.py \
            tests/test_image_provenance.py \
            tests/test_assay_detector_fastq.py \
            tests/test_metadata_correction.py \
            tests/test_benchmark_a1_seqc_maqc.py \
            tests/test_benchmark_a2_kang_muscat.py \
            tests/test_benchmark_b1_design_governance.py \
            tests/test_benchmark_b2_claim_narrative.py \
            tests/test_benchmark_b4_null_narrative.py \
            tests/test_benchmark_scatac_da.py \
            tests/test_bulk_rna.py

      - name: Narrative kernel + claim/causal + closeout
        run: |
          python -m pytest -q \
            tests/test_narrative_types.py \
            tests/test_narrative_validators.py \
            tests/test_narrator_scrna.py \
            tests/test_narrator_bulk.py \
            tests/test_narrative_render_blocks.py \
            tests/test_causal_guard.py \
            tests/test_claim_compiler.py \
            tests/test_biological_synthesis.py \
            tests/test_run_ledger_and_devils.py \
            tests/test_ledger_claim_linkage.py \
            tests/test_ledger_export.py \
            tests/test_render_ledger_e2e.py \
            tests/test_stage4_closeout.py \
            tests/test_calibration_badge.py \
            tests/test_calibration_spike_in.py \
            tests/test_fdr_advanced_disclosure.py \
            tests/test_llm_provider_fallback.py \
            tests/test_lfc_shrinkage.py \
            tests/test_pathway_viz.py \
            tests/test_doctor.py \
            tests/test_headless_design_e2e.py \
            tests/test_env_manager_cache.py

      - name: Converted legacy native tests (P1-11, dep-gated)
        # Native conversions of the former script-style harnesses. Light/source
        # checks run here; scanpy marker/DE + pydeseq2 e2e + dataset-gated cases
        # skip in this pip lane and run in the heavy/dev lanes.
        run: |
          python -m pytest -q \
            tests/test_scrna.py \
            tests/test_environment_manager.py \
            tests/test_pbmc_e2e.py

      - name: Integration smoke suite (importorskip-gated)
        run: python -m pytest -q tests/test_pytest_smoke.py

  # ── Tier 2 (main only): heavy conda lane — BLOCKING ──────────────────────
  # Runs the real pyDESeq2 numerical-recovery gates in a SLIM scanpy+pydeseq2
  # env (envs/aria-rna-ci.yml). The FULL env solve is validated by the release
  # lane's Docker build. No continue-on-error: a failed solve or a numerical
  # regression is red.
  rna-env-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/aria-rna-ci.yml
          init-shell: bash
          cache-environment: true

      - name: Run pydeseq2-gated science gates
        shell: bash -el {0}
        env:
          NUMBA_CACHE_DIR: /tmp/numba_cache
        run: |
          pip install -e .
          python -m pytest -q \
            tests/test_benchmark_synthetic_de.py \
            tests/test_benchmark_a1_seqc_maqc.py \
            tests/test_benchmark_a2_kang_muscat.py \
            tests/test_benchmark_scatac_da.py \
            tests/test_calibration_spike_in.py \
            tests/test_lfc_shrinkage.py \
            tests/test_composition_collinearity.py \
            tests/test_bulk_covariates.py \
            tests/test_bulk_rna.py \
            tests/test_scrna.py

  # ── Secret scanning (PR + push + tags): supply-chain hygiene ─────────────
  # P2-2: gitleaks fails the build if a credential is committed. Runs on the
  # full history (fetch-depth 0) so a secret in an older commit is also caught.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tier 3 (tags v* only): release reproducibility ───────────────────────
  # Validates the published Docker images (base + RNA modality) solve the env,
  # runs a real bulk+pseudobulk DE recovery benchmark inside the container, and
  # emits a CycloneDX SBOM of the image (P2-2 supply chain).
  release-repro:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the common base layer
        run: |
          docker build -f docker/Dockerfile.base -t aria-base:ci \
            --build-arg ARIA_IMAGE_REVISION="${GITHUB_SHA}" .

      - name: Build the reproducible RNA image (validates conda env solve)
        run: |
          ENV_SHA=$(sha256sum envs/aria-rna-env.yml | cut -d' ' -f1)
          docker build -f docker/Dockerfile.rna -t aria-rna:ci \
            --build-arg ARIA_BASE_IMAGE=aria-base:ci \
            --build-arg ARIA_IMAGE_ENV_SHA="$ENV_SHA" .

      - name: Real synthetic-DE recovery benchmark inside the image
        run: |
          docker run --rm -e NUMBA_CACHE_DIR=/tmp/numba_cache aria-rna:ci \
            python -m pytest -q \
              /opt/aria/tests/test_benchmark_synthetic_de.py

      - name: Generate CycloneDX SBOM of the RNA image (P2-2 supply chain)
        uses: anchore/sbom-action@v0
        with:
          image: aria-rna:ci
          format: cyclonedx-json
          output-file: aria-rna.sbom.cdx.json
          artifact-name: aria-rna-sbom.cdx.json
