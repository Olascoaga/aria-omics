name: ARIA CI

# Blocking multi-tier CI + supply-chain hygiene (reworked in D3 to collect tests/
# dynamically instead of brittle hand-maintained file allowlists):
#   PR      -> lint + packaging metadata + full `pytest tests/` in pure-Python +
#              statsmodels + TUI env (conda/heavy-dep tests self-skip via importorskip)
#   main    -> PR checks + full `pytest tests/` in RNA/pyDESeq2 conda lane +
#              Hi-C/cooler conda lane + Multiome/MuData/MOFA+ conda lane
#   release -> base + RNA/ATAC/chromatin/TOBIAS Docker builds + in-container
#              smoke & benchmark suites + CycloneDX SBOM (P2-2)
#   always  -> gitleaks secret scan (P2-2)
# No lane is `continue-on-error`: a red lane is a real failure signal.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Tier 1 (PR + main): compile + packaging + full pure-Python test suite ──
  # Dynamically collects all `tests/` (except legacy script-style harnesses in
  # `tests/conftest.py:collect_ignore`). Tests needing conda-only packages
  # (`pydeseq2`, `scanpy`, `cooler`, `mudata`, `mofapy2`, `snapatac2`) self-skip
  # via `pytest.importorskip` here and execute in the conda lanes below.
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + light test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tui]"
          pip install pytest numpy pandas scipy statsmodels anndata scikit-learn matplotlib

      - name: Byte-compile the package
        run: python -m compileall -q aria

      - name: Packaging metadata (P2-1, reproducible install)
        run: |
          python -c "import importlib.metadata as m, aria; \
            md = m.metadata('aria-omics'); \
            assert md['Requires-Python'] == '>=3.11', md['Requires-Python']; \
            assert m.version('aria-omics') == aria.__version__, m.version('aria-omics')"
          python -m pytest -q tests/test_packaging.py

      - name: Full pure-Python test suite (all tests/, importorskip-gated)
        run: python -m pytest -q tests/

  # ── Tier 2a (main only): RNA + pyDESeq2 + scanpy conda lane — BLOCKING ─────
  # Runs full `pytest tests/` in envs/aria-rna-ci.yml + `pip install -e . pytest statsmodels`.
  # Only `tests/test_cockpit_render.py` is ignored because optional `[tui]`
  # (`textual`) is intentionally excluded from the science conda lane (covered by
  # `pr-checks`). All pyDESeq2, scanpy, pseudobulk DE, bulk RNA, chromatin DA,
  # LOBO, contrast-family FDR, Wave 1-6, and oracle suites run automatically.
  rna-env-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/aria-rna-ci.yml
          init-shell: bash
          cache-environment: true

      - name: Run full suite in RNA/pyDESeq2 conda env
        shell: bash -el {0}
        env:
          NUMBA_CACHE_DIR: /tmp/numba_cache
        run: |
          pip install -e . pytest statsmodels
          python -m pytest -q tests/ \
            --ignore=tests/test_cockpit_render.py

  # ── Tier 2b (main only): Hi-C / cooler / cooltools conda lane — BLOCKING ───
  # Exercises all Hi-C, cooler, cooltools, and differential-3D tests dynamically
  # from `tests/` inside envs/aria-hic-env.yml (`numpy<2` preserved).
  hic-env-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/aria-hic-env.yml
          init-shell: bash
          cache-environment: true

      - name: Run Hi-C / cooler / cooltools tests
        shell: bash -el {0}
        env:
          NUMBA_CACHE_DIR: /tmp/numba_cache
        run: |
          pip install "numpy<2" -e . pytest statsmodels
          python -m pytest -q tests/ \
            --ignore=tests/test_cockpit_render.py \
            -k "hic or cooler or topology or differential_3d"

  # ── Tier 2c (main only): Multiome / MuData / MOFA+ / WNN lane — BLOCKING ───
  # Exercises paired Multiome, WNN, MOFA+, peak2gene, eRegulons, SnapATAC2,
  # cross-modal concordance, and SEACR/IDR tests dynamically from `tests/` inside
  # envs/aria-integration-env.yml (`numpy<2` preserved).
  integration-env-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/aria-integration-env.yml
          init-shell: bash
          cache-environment: true

      - name: Run Multiome / MuData / MOFA+ / WNN / peak2gene tests
        shell: bash -el {0}
        env:
          NUMBA_CACHE_DIR: /tmp/numba_cache
        run: |
          pip install "numpy<2" -e . pytest statsmodels
          python -m pytest -q tests/ \
            --ignore=tests/test_cockpit_render.py \
            -k "wnn or mofa or peak2gene or eregulon or mudata or multiome or snapatac or fragments_to_matrix or cohort_union or cross_modal or seacr or idr"

  # ── Secret scanning (PR + push + tags): supply-chain hygiene ───────────────
  # P2-2: gitleaks fails the build if a credential is committed. Runs on the
  # full history (fetch-depth 0) so a secret in an older commit is also caught.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tier 3 (tags v* only): release reproducibility ─────────────────────────
  # Validates all published modality Docker images solve their conda specs, runs
  # real scientific tests inside EVERY built image (RNA, chromatin, ATAC, TOBIAS),
  # and emits a CycloneDX SBOM of the RNA image (P2-2 supply chain).
  release-repro:
    # Tags run it automatically; workflow_dispatch lets a branch validate the
    # Docker images before a release is tagged (v4.9.6 lesson).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the common base layer
        run: |
          docker build -f docker/Dockerfile.base -t aria-base:ci \
            --build-arg ARIA_IMAGE_REVISION="${GITHUB_SHA}" .

      - name: Build the reproducible RNA image (validates conda env solve)
        run: |
          ENV_SHA=$(sha256sum envs/aria-rna-env.yml | cut -d' ' -f1)
          docker build -f docker/Dockerfile.rna -t aria-rna:ci \
            --build-arg ARIA_BASE_IMAGE=aria-base:ci \
            --build-arg ARIA_IMAGE_ENV_SHA="$ENV_SHA" .

      - name: Build the reproducible scATAC / ATAC aligner & chromatin images (ADR-076)
        run: |
          ATAC_SHA=$(sha256sum envs/aria-atacseq-env.yml | cut -d' ' -f1)
          docker build -f docker/Dockerfile.atacseq -t aria-atacseq:ci \
            --build-arg ARIA_BASE_IMAGE=aria-base:ci \
            --build-arg ARIA_IMAGE_ENV_SHA="$ATAC_SHA" .
          CHROM_SHA=$(sha256sum envs/aria-chromatin-env.yml | cut -d' ' -f1)
          docker build -f docker/Dockerfile.chromatin -t aria-chromatin:ci \
            --build-arg ARIA_BASE_IMAGE=aria-base:ci \
            --build-arg ARIA_IMAGE_ENV_SHA="$CHROM_SHA" .
          TOBIAS_SHA=$(sha256sum envs/aria-tobias-env.yml | cut -d' ' -f1)
          docker build -f docker/Dockerfile.tobias -t aria-tobias:ci \
            --build-arg ARIA_BASE_IMAGE=aria-base:ci \
            --build-arg ARIA_IMAGE_ENV_SHA="$TOBIAS_SHA" .

      - name: Real synthetic-DE benchmark + statistical oracles inside RNA image
        run: |
          docker run --rm -e NUMBA_CACHE_DIR=/tmp/numba_cache aria-rna:ci \
            python -m pytest -q \
              /opt/aria/tests/test_benchmark_synthetic_de.py \
              /opt/aria/tests/oracle/

      - name: Real chromatin / scATAC / SEACR-IDR smoke inside chromatin image
        run: |
          # pytest is test tooling only; it is installed in the throwaway container,
          # not baked into the published image.
          docker run --rm -e NUMBA_CACHE_DIR=/tmp/numba_cache aria-chromatin:ci \
            bash -c "python -m pip install -q pytest && python -m pytest -q \
              /opt/aria/tests/test_chromatin_fragments_to_matrix.py \
              /opt/aria/tests/test_bulk_atac_peak_counts.py \
              /opt/aria/tests/test_seacr_idr_spikein.py \
              /opt/aria/tests/oracle/test_oracle_seacr_idr.py \
              /opt/aria/tests/oracle/test_oracle_peak2gene_core.py"

      - name: Aligner binary & contract verification inside ATAC-seq image
        run: |
          docker run --rm aria-atacseq:ci \
            bash -c "command -v bwa-mem2 && command -v samtools && command -v chromap && \
              python -m pip install -q pytest && python -m pytest -q /opt/aria/tests/test_atac_align.py /opt/aria/tests/test_chromatin_scatac_align.py"

      - name: TOBIAS binary & footprinting verification inside TOBIAS image
        run: |
          docker run --rm aria-tobias:ci \
            bash -c "TOBIAS --version && \
              python -m pip install -q pytest && python -m pytest -q /opt/aria/tests/test_chromatin_footprint_tobias.py /opt/aria/tests/test_tobias_production_e2e.py"

      - name: Generate CycloneDX SBOM of the RNA image (P2-2 supply chain)
        uses: anchore/sbom-action@v0
        with:
          image: aria-rna:ci
          format: cyclonedx-json
          output-file: aria-rna.sbom.cdx.json
          artifact-name: aria-rna-sbom.cdx.json
