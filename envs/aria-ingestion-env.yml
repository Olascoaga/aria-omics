name: aria-ingestion-env

# Raw input ingestion stack.
# Keep FASTQ quantification tooling out of aria-rna-env so the validated
# Scanpy/DE environment is not destabilized by kallisto-bustools dependencies.
channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict

dependencies:
  - python=3.11
  - numpy>=1.24,<2.0.0
  - scipy>=1.11
  - pandas>=2.0,<3.0
  - h5py>=3.9
  - anndata>=0.10,<0.11
  - scanpy>=1.9.6,<2.0
  - kb-python>=0.29,<1.0
  - kallisto>=0.50
  - bustools>=0.43
