name: aria-rna-env

# CRITICAL: strict channel priority prevents dynamic library corruption
# conda-forge must be first — bioconda packages depend on it
channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict

dependencies:
  - python=3.11

  # ── Core scientific stack ────────────────────────────────────────────
  # numpy 2.x is REQUIRED here — pydeseq2 0.5.4 (the DE/DA core) needs numpy>=2,
  # and the validated lock is numpy 2.4.3 with scanpy 1.11 + anndata 0.12 (all
  # green on numpy 2.x). Do NOT cap below 2.0: a numpy<2 YAML solve breaks the
  # validated RNA stack at the pydeseq2 import. The chromatin env stays numpy 1.x
  # (MACS2) and the ingestion/kb env stays numpy 1.x — those are separate locks.
  - numpy>=2.0,<3.0
  - pandas>=2.0,<3.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - h5py>=3.9
  - hdf5

  # ── UMAP dependency chain (must be pinned together) ──────────────────
  # numba/llvmlite version mismatch causes segfaults during UMAP.
  # These versions are tested stable as of 2025.
  - numba>=0.58,<0.62
  - llvmlite>=0.41,<0.45
  - umap-learn>=0.5.4,<0.6

  # ── Single-cell analysis ─────────────────────────────────────────────
  - scanpy>=1.9.6,<2.0
  - anndata>=0.10,<0.11
  - leidenalg>=0.10
  - python-igraph>=0.11

  # ── Spatial transcriptomics ──────────────────────────────────────────
  - squidpy>=1.3

  # ── Visualization ────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # Differential expression
    - pydeseq2>=0.4

    # Doublet detection
    - scrublet>=0.2.3

    # Cell type deconvolution (spatial)
    - cell2location>=0.1.3

    # Gene set / pathway analysis
    - gseapy>=1.0
    - decoupler-py>=1.4

    # GSEA with running sum plots (pre-ranked, more sensitive than ORA cutoff)
    - blitzgsea>=1.3
