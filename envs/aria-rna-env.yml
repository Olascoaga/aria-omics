name: aria-rna-env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - h5py>=3.9
  - hdf5

  # Single-cell analysis
  - scanpy>=1.9.6
  - anndata>=0.10
  - leidenalg>=0.10
  - python-igraph>=0.11

  # Spatial transcriptomics
  - squidpy>=1.3

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # Differential expression
    - pydeseq2>=0.4

    # Cell type deconvolution (spatial)
    - cell2location>=0.1.3

    # Doublet detection
    - scrublet>=0.2.3

    # Gene set analysis
    - gseapy>=1.0
    - decoupler-py>=1.4
