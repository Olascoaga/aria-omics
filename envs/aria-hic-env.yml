name: aria-hic-env

channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict

dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2.0.0
  - pandas>=2.0,<3.0
  - scipy>=1.11
  - numba>=0.58
  - h5py>=3.9

  # ── BAM/BED/genome tools ───────────────────────────────────────────────────
  - pysam>=0.21
  - pybedtools>=0.9
  - bedtools>=2.31

  # ── Visualization ──────────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    - cooler==0.12.1
    - cooltools==0.7.1
    - bioframe==0.8.0
    - pairtools==1.1.2
    - hic-straw==1.3.1
