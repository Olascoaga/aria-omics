name: aria-integration-env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - h5py>=3.9

  # Multimodal single-cell
  - scanpy>=1.9.6
  - anndata>=0.10
  - muon>=0.1           # multimodal AnnData (MuData)
  - leidenalg>=0.10
  - python-igraph>=0.11

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # Multi-omics factor analysis
    - mofapy2>=0.7      # MOFA+

    # RNA+ATAC joint embedding
    - scglue>=0.3       # graph-linked unified embedding

    # WNN integration (RNA + ATAC weights)
    - muon>=0.1

    # GRN inference
    - pyscenic>=0.12    # SCENIC+ for regulatory networks
    - decoupler-py>=1.4
