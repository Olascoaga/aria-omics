name: aria-integration-env

channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict

dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2.0.0
  - pandas>=2.2,<3.0
  - scipy>=1.12,<2.0.0
  - scikit-learn>=1.4,<2.0.0
  - h5py>=3.9

  # ── BAM/BED/genome tools (shared paired multiome & regulatory layers) ──
  - pysam>=0.21
  - pybedtools>=0.9
  - bedtools>=2.31

  # ── Visualization ────────────────────────────────────────────────────
  - matplotlib>=3.6
  - seaborn>=0.12

  - pip:
    # Multi-omics factor analysis (pure Python variational Bayes MOFA+)
    - mofapy2==0.7.4

    # Multimodal AnnData / MuData container & single-cell chromatin stack
    - anndata==0.11.4
    - scanpy==1.11.0
    - muon==0.1.7
    - mudata==0.3.3
    - snapatac2==2.9.0
    # snapatac2 2.9.0 deps pinned to the validated pip lock: an unpinned resolve pulled
    # pyarrow 26 (requires NumPy>=2) into this numpy<2 env, so fragment import failed
    # (honest-skip fragment_import_failed) on CI for v4.9.5.
    - polars==1.38.1
    - polars-runtime-32==1.38.1
    - pyarrow==23.0.1
    - episcanpy==0.4.0
    - MACS3==3.0.4
    - pyBigWig==0.3.25
