name: aria-integration-env

channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict

dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2.0.0
  - pandas>=2.2,<3.0
  - scipy>=1.12,<2.0.0
  - scikit-learn>=1.4,<2.0.0
  - h5py>=3.9

  # ── BAM/BED/genome tools (shared paired multiome & regulatory layers) ──
  - pysam>=0.21
  - pybedtools>=0.9
  - bedtools>=2.31

  # ── Visualization ────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # Multi-omics factor analysis (pure Python variational Bayes MOFA+)
    - mofapy2==0.7.4

    # Multimodal AnnData / MuData container & single-cell chromatin stack
    - muon==0.1.7
    - mudata==0.3.3
    - snapatac2==2.9.0
    - episcanpy==0.4.0
    - MACS3==3.0.4
    - pyBigWig==0.3.25
