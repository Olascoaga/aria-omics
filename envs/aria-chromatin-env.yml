name: aria-chromatin-env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<2.0.0
  - pandas>=2.2,<3.0
  - scipy>=1.12
  - h5py>=3.9

  # ── BAM/BED/genome tools ─────────────────────────────────────────────
  - pysam>=0.21         # from bioconda
  - pybedtools>=0.9
  - bedtools>=2.31

  # ── Visualization ────────────────────────────────────────────────────
  - matplotlib>=3.7
  - seaborn>=0.12

  - pip:
    # MACS3 may need build constraints to avoid NumPy 2 ABI drift:
    # pip install --build-constraint envs/aria-chromatin-build-constraints.txt MACS3==3.0.4
    - MACS3==3.0.4
    - snapatac2==2.9.0
    - episcanpy==0.4.0
    - muon==0.1.7
    - mudata==0.3.3
    - pyBigWig==0.3.25
